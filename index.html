<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网页</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 40px;
            color: #667eea;
        }

        header p {
            margin-top: 15px;
            color: #666;
            font-size: 18px;
        }

        .card {
            background: #f7f8fc;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #764ba2;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.8;
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            background: #764ba2;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
        }

        @media(max-width:600px){
            .container {
                padding: 25px;
            }

            header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>欢迎来到我的网页</h1>
        <p>这是一个纯 HTML + CSS 制作的页面</p>
    </header>


    <div class="card">
        <h2>关于我</h2>
        <p>
            你好！这是我的个人介绍区域。
            你可以在这里填写自己的名字、职业、兴趣爱好等信息。
        </p>
    </div>


    <div class="card">
        <h2>我的技能</h2>
        <p>
            HTML网页制作<br>
            CSS页面设计<br>
            JavaScript交互开发
        </p>
    </div>


    <div class="card">
        <h2>联系方式</h2>
        <p>
            邮箱：example@email.com<br>
            电话：123-456-7890
        </p>

        <a class="button" href="#">
            联系我
        </a>
    </div>


    <footer>
        © 2026 我的网页
    </footer>

</div>

</body>
</html>
